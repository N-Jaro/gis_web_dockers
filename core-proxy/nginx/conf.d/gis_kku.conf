# Geoinformatics KKU Main Site (geoinformatics.kku.ac.th)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name geoinformatics.kku.ac.th;

    # Allow ACME challenge for Let's Encrypt (keeping it for future domain switch)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# SSL Configuration for IP access (Self-Signed Cert)
server {
    listen 443 ssl http2;
    server_name geoinformatics.kku.ac.th;

    # Self-signed certificate paths (generated on server)
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Basic SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2048M;

    # ----------------------------------------------------
    # 🔒 SECURITY HEADERS & HARDENING
    # ----------------------------------------------------
    # The 'always' parameter ensures headers persist across redirects (301/302) and errors (404/500)
    
    # 1. Anti-Clickjacking Protection
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # 2. Prevent MIME-Type Sniffing
    add_header X-Content-Type-Options "nosniff" always; 
    
    # 3. Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always; 
    
    # 4. Strict Transport Security (HSTS) - Solves low alert L7
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; 

    # 5. Content Security Policy (CSP) tailored for WordPress - Solves medium alert 2
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://connect.facebook.net https://www.facebook.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        img-src 'self' data: https://*.kku.ac.th https://secure.gravatar.com https://*.facebook.com https://*.fbcdn.net;
        font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        connect-src 'self' https://connect.facebook.net;
        frame-ancestors 'self';
        form-action 'self';
        base-uri 'self';
        object-src 'none';
        media-src 'self';
        worker-src 'self';
        manifest-src 'self';
        upgrade-insecure-requests;
    " always; 

    # 6. Hide Nginx Version numbers - Helps clear low alert L6
    server_tokens off; 
    # ----------------------------------------------------

    location / {
        proxy_pass http://gis_wp_app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for large uploads/slow connections
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

