# Geoinformatics KKU Main Site (geoinformatics.kku.ac.th)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name geoinformatics.kku.ac.th;
    client_max_body_size 512M;

    # Allow ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Direct access via HTTP (Temporary for IP access before domain is ready)
    location / {
        proxy_pass http://gis_wp_app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for large uploads/slow connections
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

