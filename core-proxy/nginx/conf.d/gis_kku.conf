# Geoinformatics KKU Main Site (geoinformatics.kku.ac.th)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name geoinformatics.kku.ac.th;

    # Allow ACME challenge for Let's Encrypt (keeping it for future domain switch)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# SSL Configuration for IP access (Self-Signed Cert)
server {
    listen 443 ssl;
    http2 on; # Cleaned up deprecated warning!
    server_name geoinformatics.kku.ac.th;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2048M;

    # 🔒 GLOBAL SECURITY HEADERS
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 🛡️ UPDATED COMPATIBLE CSP FOR WORDPRESS
    # Added 'blob:' to script-src and worker-src to fix the WordPress emoji blocks
    # Added broad image parameters to prevent slides from getting locked down
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://www.google.com https://www.gstatic.com https://cdn.jsdelivr.net https://connect.facebook.net https://www.facebook.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https: http:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://connect.facebook.net; frame-src 'self' https://www.facebook.com https://web.facebook.com https://www.google.com; worker-src 'self' blob:; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests;" always;

    server_tokens off;

    # Root proxy path to backend Apache container
    location / {
        # Hide proxy duplicate headers securely without altering resource retrieval paths
        proxy_hide_header X-Powered-By;

        proxy_pass http://gis_wp_app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}