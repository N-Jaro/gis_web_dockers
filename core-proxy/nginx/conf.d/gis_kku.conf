# Geoinformatics KKU Main Site (geoinformatics.kku.ac.th)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 10.198.110.46;

    # Allow ACME challenge for Let's Encrypt (keeping it for future domain switch)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# SSL Configuration for IP access (Self-Signed Cert)
server {
    listen 443 ssl http2;
    server_name 10.198.110.46;

    # Self-signed certificate paths (generated on server)
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Basic SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2048M;

    location / {
        proxy_pass http://gis_wp_app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for large uploads/slow connections
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

